{% extends 'base.html' %}
{% block title %}Forgot Password - Campus Cognition{% endblock %}
{% block content %}
<div class="row justify-content-center py-5"><div class="col-md-6 col-lg-5">
  <div class="glass-card p-4">
    <h3 class="mb-2">Reset your password</h3>
    <p class="text-muted">Enter the email used to register. We will send a secure reset link.</p>
    <form id="forgotForm"><label class="form-label" for="email">Email address</label>
      <input class="form-control mb-3" id="email" type="email" required autocomplete="email">
      <button class="btn btn-primary w-100">Send reset link</button>
    </form>
    <p id="result" class="mt-3 mb-0"></p>
  </div>
</div></div>
<script>
document.getElementById('forgotForm').addEventListener('submit', async event => {
  event.preventDefault();
  const result = document.getElementById('result');
  const response = await fetch('{{ url_for("forgot_password") }}', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email: document.getElementById('email').value})});
  const data = await response.json(); result.textContent = data.message; result.className = data.success ? 'mt-3 mb-0 text-success' : 'mt-3 mb-0 text-danger';
});
</script>
{% endblock %}
