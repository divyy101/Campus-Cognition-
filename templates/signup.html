{% extends "base.html" %}
{% block title %}Create Account — Campus Cognition{% endblock %}

{% block auth_content %}
<div class="animate-fade-in" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--space-6);background:var(--bg-primary);">
    <div class="card" style="width:100%;max-width:460px;padding:var(--space-8);box-shadow:var(--shadow-lg);">
        <div class="text-center mb-6">
            <div class="sidebar-brand-icon" style="margin:0 auto var(--space-3);width:48px;height:48px;font-size:1.3rem;">C</div>
            <h2 class="font-bold text-xl">Create Account</h2>
            <p class="text-xs text-muted mt-1">Get started with AI-powered study and career support</p>
        </div>

        <form id="signupForm">
            <div class="grid grid-2">
                <div class="form-group">
                    <label class="form-label">First Name</label>
                    <input type="text" id="firstName" class="form-input" placeholder="John" required autocomplete="given-name">
                </div>
                <div class="form-group">
                    <label class="form-label">Last Name</label>
                    <input type="text" id="lastName" class="form-input" placeholder="Doe" required autocomplete="family-name">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-input" placeholder="johndoe" required autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-input" placeholder="john.doe@university.edu" required autocomplete="email">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn btn-primary w-full mt-4" id="submitBtn">
                Create Account
            </button>
        </form>

        <div class="text-center mt-6">
            <span class="text-xs text-muted">Already have an account?</span>
            <a href="/login" class="text-xs font-semibold">Sign in instead</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Registering...';

    const data = {
        first_name: document.getElementById('firstName').value.trim(),
        last_name: document.getElementById('lastName').value.trim(),
        username: document.getElementById('username').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
    };

    try {
        const resp = await submitJSON('/signup', data, { showToast: true });
        if (!resp.success) {
            btn.disabled = false;
            btn.textContent = 'Create Account';
        }
    } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Create Account';
    }
});
</script>
{% endblock %}
