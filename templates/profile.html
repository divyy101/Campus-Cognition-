{% extends "base.html" %}
{% block title %}Profile — Campus Cognition{% endblock %}

{% block content %}
<div class="page-container animate-fade-in" style="--page-accent: var(--profile-accent);">
    <div class="page-header">
        <h1 class="page-title" style="color:var(--profile-accent);">👤 Student Profile</h1>
        <p class="page-subtitle">Manage your academic details and career preferences for AI matchmaking.</p>
    </div>

    <div class="grid grid-2 gap-5">
        <!-- Profile Form -->
        <div class="card animate-slide-up stagger-1">
            <h3 class="card-title mb-4">Academic & Career Details</h3>
            <form id="profileForm">
                <div class="grid grid-2">
                    <div class="form-group">
                        <label class="form-label">Department / Major</label>
                        <input type="text" id="branch" class="form-input" placeholder="e.g. CSE" value="{{ user.branch or '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Current CGPA</label>
                        <input type="number" id="cgpa" class="form-input" step="0.01" min="0" max="10" placeholder="e.g. 8.5" value="{{ user.cgpa or '' }}">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Core Skills (comma separated)</label>
                    <input type="text" id="skills" class="form-input" placeholder="e.g. Python, SQL, DSA, React, Docker" value="{{ user.skills|join(', ') if user.skills else '' }}">
                </div>

                <div class="form-group">
                    <label class="form-label">Career Goals & Targets</label>
                    <textarea id="careerGoals" class="form-textarea" placeholder="Describe your career aspiration, target job titles, and fields (e.g. AI research, Cloud Engineering)...">{{ user.career_goals or '' }}</textarea>
                </div>

                <button type="submit" class="btn btn-primary w-full" id="saveProfileBtn">
                    <i data-lucide="save" style="width:18px;height:18px;"></i>
                    Save Preferences
                </button>
            </form>
        </div>

        <!-- Security / Password change -->
        <div class="card animate-slide-up stagger-2" style="height:fit-content;">
            <h3 class="card-title mb-4">Security Settings</h3>
            <form id="passwordForm">
                <div class="form-group">
                    <label class="form-label">Current Password</label>
                    <input type="password" id="currPass" class="form-input" required placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <input type="password" id="newPass" class="form-input" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-ghost w-full" id="changePassBtn">
                    <i data-lucide="lock" style="width:18px;height:18px;"></i>
                    Change Password
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('saveProfileBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Saving...';

    // Parse comma-separated inputs
    const skillsText = document.getElementById('skills').value;
    const skillsArray = skillsText.split(',').map(s => s.trim()).filter(s => s.length > 0);

    const data = {
        branch: document.getElementById('branch').value.trim(),
        cgpa: document.getElementById('cgpa').value.trim(),
        skills: skillsArray,
        career_goals: document.getElementById('careerGoals').value.trim()
    };

    try {
        const res = await fetch('/profile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const resp = await res.json();
        if (resp.success) {
            Toast.show('Preferences updated successfully!', 'success');
        } else {
            Toast.show(resp.message || 'Failed to save', 'error');
        }
    } catch (e) {
        Toast.show('Network error.', 'error');
    }

    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="save" style="width:18px;height:18px;"></i> Save Preferences';
});

document.getElementById('passwordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('changePassBtn');
    btn.disabled = true;

    const data = {
        current_password: document.getElementById('currPass').value,
        new_password: document.getElementById('newPass').value
    };

    try {
        const res = await fetch('/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const resp = await res.json();
        if (resp.success) {
            Toast.show('Password updated successfully!', 'success');
            document.getElementById('passwordForm').reset();
        } else {
            Toast.show(resp.message || 'Failed to update password', 'error');
        }
    } catch (e) {
        Toast.show('Network error.', 'error');
    }

    btn.disabled = false;
});
</script>
{% endblock %}
