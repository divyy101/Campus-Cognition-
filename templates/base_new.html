<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Campus Cognition{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <!-- Our CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="theme-{% block theme_class %}default{% endblock %}">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h5><i class="bi bi-lightning-charge"></i> Campus Cognition</h5>
        </div>
        <ul class="sidebar-nav">
            <li class="nav-item">
                <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}">
                    <i class="bi bi-house-fill"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('study') }}" class="nav-link {% if request.endpoint == 'study' %}active{% endif %}">
                    <i class="bi bi-book-fill"></i> Study Agent
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('scholarships') }}" class="nav-link {% if request.endpoint == 'scholarships' %}active{% endif %}">
                    <i class="bi bi-mortarboard-fill"></i> Scholarships
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('internships') }}" class="nav-link {% if request.endpoint == 'internships' %}active{% endif %}">
                    <i class="bi bi-briefcase-fill"></i> Internships
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('opportunities') }}" class="nav-link {% if request.endpoint == 'opportunities' %}active{% endif %}">
                    <i class="bi bi-star-fill"></i> Opportunities
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('code_assistant') }}" class="nav-link {% if request.endpoint == 'code_assistant' %}active{% endif %}">
                    <i class="bi bi-code-square"></i> Code Agent
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('profile') }}" class="nav-link {% if request.endpoint == 'profile' %}active{% endif %}">
                    <i class="bi bi-person-circle"></i> Profile
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('activity') }}" class="nav-link {% if request.endpoint == 'activity' %}active{% endif %}">
                    <i class="bi bi-graph-up"></i> Activity
                </a>
            </li>
            <li class="nav-item border-top mt-3 pt-3">
                <a href="{{ url_for('logout') }}" class="nav-link">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </a>
            </li>
        </ul>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <button class="btn btn-outline" id="sidebarToggle" style="border: none; color: var(--accent-blue);">
                    <i class="bi bi-list" style="font-size: 1.5rem;"></i>
                </button>
                <span class="navbar-brand d-lg-none ms-2">Campus Cognition</span>
                <div class="ms-auto d-flex align-items-center gap-3">
                    <button class="btn btn-outline" id="themeToggle" title="Toggle Theme" style="border: none; color: var(--accent-blue);">
                        <i class="bi bi-moon-fill"></i>
                    </button>
                </div>
            </div>
        </nav>

        <!-- Content Block -->
        <div id="content">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script>
        // Sidebar toggle
        document.getElementById('sidebarToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('active');
        });

        // Close sidebar on mobile when navigating
        document.querySelectorAll('.sidebar-nav a').forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth < 768) {
                    document.getElementById('sidebar').classList.remove('active');
                }
            });
        });

        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        const initialTheme = localStorage.getItem('theme') || 'dark';
        if (initialTheme === 'light') {
            document.body.style.filter = 'invert(1)';
        }
        
        themeToggle.addEventListener('click', () => {
            const activeTheme = localStorage.getItem('theme') || 'dark';
            const newTheme = activeTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', newTheme);
            document.body.style.filter = newTheme === 'light' ? 'invert(1)' : 'none';
        });

        // Toast notification function
        function showToast(message, type = 'info') {
            const toastHTML = `
                <div class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="toast-header" style="background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; border: none;">
                        <i class="bi bi-info-circle me-2"></i>
                        <strong class="me-auto">${type.charAt(0).toUpperCase() + type.slice(1)}</strong>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
                    </div>
                    <div class="toast-body" style="background: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--text-primary);">
                        ${message}
                    </div>
                </div>
            `;
            const container = document.getElementById('toastContainer');
            const toastDiv = document.createElement('div');
            toastDiv.innerHTML = toastHTML;
            container.appendChild(toastDiv);
            const toast = new bootstrap.Toast(toastDiv.querySelector('.toast'));
            toast.show();
            setTimeout(() => toastDiv.remove(), 5000);
        }

        // AJAX Form submission
        document.querySelectorAll('form[id]').forEach(form => {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(form);
                try {
                    const response = await fetch(form.action || form.getAttribute('action') || window.location.href, {
                        method: form.method || 'POST',
                        body: formData
                    });
                    const data = await response.json();
                    if (data.success) {
                        showToast(data.message || 'Success!', 'success');
                        if (data.redirect) {
                            setTimeout(() => window.location.href = data.redirect, 1500);
                        }
                    } else {
                        showToast(data.message || 'Error occurred', 'error');
                    }
                } catch (error) {
                    showToast('An error occurred', 'error');
                }
            });
        });
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
