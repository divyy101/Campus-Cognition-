{% extends 'base.html' %}
{% block title %}Choose New Password - Campus Cognition{% endblock %}
{% block content %}
<div class="row justify-content-center py-5"><div class="col-md-6 col-lg-5"><div class="glass-card p-4">
  <h3>Choose a new password</h3><p class="text-muted">Use at least 6 characters.</p>
  <form id="resetForm"><input id="password" class="form-control mb-3" type="password" placeholder="New password" required minlength="6" autocomplete="new-password">
  <input id="confirm_password" class="form-control mb-3" type="password" placeholder="Confirm new password" required minlength="6" autocomplete="new-password">
  <button class="btn btn-primary w-100">Reset password</button></form><p id="result" class="mt-3 mb-0"></p>
</div></div></div>
<script>
document.getElementById('resetForm').addEventListener('submit', async event => { event.preventDefault(); const r = await fetch('{{ url_for("reset_password", token=token) }}', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:password.value, confirm_password:confirm_password.value})}); const d = await r.json(); result.textContent=d.message; result.className=d.success?'mt-3 mb-0 text-success':'mt-3 mb-0 text-danger'; if(d.success) setTimeout(()=>location.href=d.redirect, 1200); });
</script>
{% endblock %}
