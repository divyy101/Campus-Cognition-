{% extends 'base.html' %}
{% block title %}Choose New Password - Campus Cognition{% endblock %}
{% block content %}
<div class="row justify-content-center py-5"><div class="col-md-6 col-lg-5"><div class="glass-card p-4">
  <h3>Choose a new password</h3><p class="text-muted">Use at least 8 characters.</p>
  <form id="resetForm"><input id="password" class="form-control mb-3" type="password" placeholder="New password" required minlength="8" autocomplete="new-password">
  <input id="confirm_password" class="form-control mb-3" type="password" placeholder="Confirm new password" required minlength="8" autocomplete="new-password">
  <button class="btn btn-primary w-100">Reset password</button></form><p id="result" class="mt-3 mb-0"></p>
</div></div></div>
<script>
document.getElementById('resetForm').addEventListener('submit', async event => {
  event.preventDefault();
  const result = document.getElementById('result');
  try {
    const response = await fetch('{{ url_for("reset_password", token=token) }}', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: document.getElementById('password').value, confirm_password: document.getElementById('confirm_password').value})
    });
    const data = await response.json();
    result.textContent = data.message;
    result.className = data.success ? 'mt-3 mb-0 text-success' : 'mt-3 mb-0 text-danger';
    if (data.success) setTimeout(() => { window.location.href = data.redirect; }, 100);
  } catch (error) {
    result.textContent = 'Unable to reset the password. Please try again.';
    result.className = 'mt-3 mb-0 text-danger';
  }
});
</script>
{% endblock %}
