<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .logo { font-size: 24px; font-weight: bold; color: #2563eb; text-decoration: none; }
        .content { background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; border-top: 4px solid #2563eb; }
        .footer { text-align: center; margin-top: 30px; font-size: 14px; color: #6b7280; }
        .message-box { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 15px; margin: 20px 0; font-size: 15px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="{{ url_for('index', _external=True) }}" class="logo">Campus Cognition</a>
    </div>
    <div class="content">
        <h2>Important Update</h2>
        <p>Hello {{ name }},</p>
        
        <div class="message-box">
            {{ message | safe }}
        </div>
    </div>
    <div class="footer">
        &copy; 2026 Campus Cognition. All rights reserved.
    </div>
</body>
</html>
