{% extends "base.html" %}
{% block title %}Sign In — Campus Cognition{% endblock %}

{% block auth_content %}
<div class="animate-fade-in" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--space-6);background:var(--bg-primary);">
    <div class="card" style="width:100%;max-width:420px;padding:var(--space-8);box-shadow:var(--shadow-lg);">
        <div class="text-center mb-6">
            <div class="sidebar-brand-icon" style="margin:0 auto var(--space-3);width:48px;height:48px;font-size:1.3rem;">C</div>
            <h2 class="font-bold text-xl">Welcome Back</h2>
            <p class="text-xs text-muted mt-1">Sign in to access your intelligence platform</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-input" placeholder="Enter your username" required autocomplete="username">
            </div>

            <div class="form-group">
                <div class="flex justify-between items-center mb-2">
                    <label class="form-label" style="margin:0;">Password</label>
                    <a href="/forgot-password" class="text-xs">Forgot password?</a>
                </div>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary w-full mt-4" id="submitBtn">
                Sign In
            </button>
        </form>

        <div class="text-center mt-6">
            <span class="text-xs text-muted">New to Campus Cognition?</span>
            <a href="/signup" class="text-xs font-semibold">Create account</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    const data = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
    };

    try {
        const resp = await submitJSON('/login', data, { showToast: true });
        if (!resp.success) {
            btn.disabled = false;
            btn.textContent = 'Sign In';
        }
    } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Sign In';
    }
});
</script>
{% endblock %}
